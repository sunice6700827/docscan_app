# 一键自动打包 Android APK
# 用法：把完整工程（已执行 flutter create 生成 android/ 后覆盖本工程文件）推送到 GitHub，
#       本工作流会自动构建 release APK，可在 Actions 页面下载。
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: # 也支持在 GitHub 网页手动点击运行

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.x"

      - name: 拉取依赖
        run: flutter pub get

      - name: 构建 release APK
        run: flutter build apk --release

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/*.apk
